[build-system]
requires = ["setuptools>=69","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-rl-trader"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "websockets>=13,<16",
  "asyncpg>=0.29,<1",
  "redis>=5,<7",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "tenacity>=9,<10",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "gymnasium>=1.0,<2",
  "torch>=2.2,<3",
  "stable-baselines3>=2.4,<3",
  "optuna>=4,<5",
  "mlflow>=2.16,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "prometheus-client>=0.21,<1",
]

[project.scripts]
crypto-dashboard = "app.dashboard_main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
